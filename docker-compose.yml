services:

  neo4j:
    image: neo4j:2026.09.0

    volumes:
      - "${HOME}/neo4j/logs:/logs"
      - "${HOME}/neo4j/conf:/conf"
      - "${HOME}/neo4j/data:/data"
      - "${HOME}/neo4j/plugins:/plugins"

    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"

    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1;" >/dev/null 2>&1'
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  api:
    build: ./api

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Missing password}"
      NEO4J_DATABASE: neo4j

    depends_on:
      neo4j:
        condition: service_healthy