services:
  postgres:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/psql-init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-myuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-mydatabase}"
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:2026.09.0
    volumes:
      - neo4j_logs:/logs
      - neo4j_conf:/conf
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - ./scripts/seeding:/import
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      DB_PASSWORD: "${NEO4J_PASSWORD}"
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$DB_PASSWORD\" 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  neo4j-init:
    image: neo4j:2026.09.0
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./scripts/neo4j-init/0-constraint.cypher:/scripts/init.cypher:ro
    environment:
      DB_PASSWORD: "${NEO4J_PASSWORD}"
    command: >
      sh -c "
      echo 'Applying Neo4j constraints...' &&
      cypher-shell -a neo4j://neo4j:7687 -u neo4j -p \"$$DB_PASSWORD\" -f /scripts/init.cypher &&
      echo 'Neo4j constraints applied.'
      "
    restart: "no"

  postgres-seed:
    image: postgres:16
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/seeding:/scripts:ro
      - postgres_data:/var/lib/postgresql/data
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER:-myuser}"
      POSTGRES_DB: "${POSTGRES_DB:-mydatabase}"
    command: >
      sh -c "
      if [ ! -f /var/lib/postgresql/data/.seeded ]; then
        echo 'Seeding PostgreSQL...'
        psql -h postgres -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -f /scripts/load-csv.sql &&
        touch /var/lib/postgresql/data/.seeded
        echo 'PostgreSQL seeding complete.'
      else
        echo 'PostgreSQL already seeded. Skipping.'
      fi
      "
    restart: "no"

  neo4j-seed:
    image: neo4j:2026.09.0
    profiles: ["seed"]
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts/seeding:/scripts:ro
      - neo4j_data:/data
    environment:
      DB_PASSWORD: "${NEO4J_PASSWORD}"
    command: >
      sh -c "
      if [ ! -f /data/.seeded ]; then
        echo 'Seeding Neo4j...'
        cypher-shell -a neo4j://neo4j:7687 -u neo4j -p \"$$DB_PASSWORD\" -f /scripts/load-csv.cypher &&
        touch /data/.seeded
        echo 'Neo4j seeding complete.'
      else
        echo 'Neo4j already seeded. Skipping.'
      fi
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mydatabase}
      SECRET_KEY: "${SECRET_KEY}"

    depends_on:
      neo4j-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_logs:
  neo4j_conf:
  neo4j_data:
  neo4j_plugins:
  postgres_data:
