        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Messages thread
          content:
            application/json:
              schema:
                type: object
                required:
                  - messages
                  - pagination
                properties:
                  messages: 
                    type: array
