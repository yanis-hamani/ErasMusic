openapi: 3.0.3
info:
  title: ErasMusic API
  description: >-
    ErasMusic is a social network for meeting people who share similar music
    tastes. The API uses PostgreSQL for relational data and Neo4j for social
    and music graph data.
  version: 1.0.0
servers:
  - url: /
    description: Current API base path
security:
  - BearerAuth: []
tags:
  - name: System
    description: Application and dependency health checks
  - name: Authentication
    description: >-
      PostgreSQL — User registration, login, token refresh, and logout
  - name: User Profiles
    description: PostgreSQL — User profile data
  - name: Friends & Social
    description: >-
      Neo4j — Social graph connections, friends, and friend request
      lifecycles
  - name: Groups
    description: 'Neo4j — Group management, memberships, and metadata tags'
  - name: Music Data
    description: 'Neo4j — Music catalog browsing (artists, songs, genres)'
  - name: Recommendations
    description: >-
      Neo4j — Time-based graph traversal discovery and personalized
      recommendations
  - name: Search
    description: PostgreSQL and Neo4j — User and group search
  - name: Chat
    description: 'PostgreSQL — Conversations, message history, and participation management'
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - System
      summary: Check service health
      description: Verifies connectivity to PostgreSQL and Neo4j.
      security: []
      responses:
        '200':
          description: The service and its database dependencies are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: At least one database dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

  /auth/register:
    post:
      operationId: registerUser
      tags:
        - Authentication
      summary: Create an account
      description: >-
        Creates a user in PostgreSQL and a corresponding User node in Neo4j.
        The password is hashed before storage. A refresh token is returned in
        an HTTP-only cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/login:
    post:
      operationId: loginUser
      tags:
        - Authentication
      summary: Authenticate a user
      description: >-
        Validates the user's credentials, returns an access token, and stores a
        refresh token in an HTTP-only cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/refresh:
    post:
      operationId: refreshAccessToken
      tags:
        - Authentication
      summary: Refresh access token/session
      description: >-
        Generates a new access token from a valid refresh token. The
        refresh_token cookie takes precedence over refreshToken in the JSON
        body. The current implementation requires a JSON object; send an empty
        object when authenticating only with the cookie.
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      requestBody:
        required: true
        description: Supply refreshToken here, or send an empty object when using the cookie.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/logout:
    post:
      operationId: logoutUser
      tags:
        - Authentication
      summary: End the current session
      description: >-
        Validates the access token, deletes the current refresh token from
        storage when its cookie is present, and clears the refresh-token
        cookie. The access JWT remains valid until it expires.
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: Logged out successfully
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me:
    get:
      operationId: getCurrentUserProfile
      tags:
        - User Profiles
      summary: Get my profile
      description: Retrieves the authenticated user's private profile.
      responses:
        '200':
          description: Profile object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateUserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCurrentUserProfile
      tags:
        - User Profiles
      summary: Update my profile
      description: Updates current user's profile metadata in PostgreSQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateUserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteCurrentUser
      tags:
        - User Profiles
      summary: Delete my account
      description: 'Permanently deletes user account, profile, and associated records.'
      responses:
        '204':
          description: Account deleted successfully
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshTokenCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          
  '/users/{userId}':
    get:
      operationId: getPublicUserProfile
      tags:
        - User Profiles
      summary: View a public profile
      description: Retrieves public profile for specified user ID.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: usr_123
      responses:
        '200':
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /friends:
    get:
      operationId: listFriends
      tags:
        - Friends & Social
      summary: List my friends
      description: >-
        Retrieves friends from Neo4j. A friendship is stored as one
        FRIENDS_WITH relationship and queried without direction.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated friends list
          content:
            application/json:
              schema:
                type: object
                required:
                  - friends
                  - pagination
                properties:
                  friends:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  '/friends/{userId}':
    get:
      operationId: getFriendshipStatus
      tags:
        - Friends & Social
      summary: Get friendship status with a user
      description: >-
        Returns the friendship status between the authenticated user and the
        specified user. The status indicates whether the users are friends,
        have a pending friend request, or have no existing relationship.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user whose friendship status you want to check.
          schema:
            type: string
          examples:
            default:
              value: usr_456
      responses:
        '200':
          description: Friendship status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendshipStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeFriend
      tags:
        - Friends & Social
      summary: Remove a friend
      description: Deletes friendship relationship in Neo4j graph.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Friendship removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /friend-requests:
    post:
      operationId: createFriendRequest
      tags:
        - Friends & Social
      summary: Send a friend request
      description: >-
        Creates a pending directed request. Requests to oneself, duplicate or
        crossed requests, and requests between existing friends return a
        conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestCreate'
      responses:
        '201':
          description: Friend request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listFriendRequests
      tags:
        - Friends & Social
      summary: List incoming and outgoing requests
      description: Returns pending requests ordered from newest to oldest.
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - incoming
              - outgoing
              - all
            default: all
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated friend requests list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFriendRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  '/friend-requests/{requestId}/accept':
    post:
      operationId: acceptFriendRequest
      tags:
        - Friends & Social
      summary: Accept a request
      description: >-
        Marks the request as accepted and creates the friendship relationship
        in Neo4j. The processed request relationship is then deleted.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request accepted and friendship established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  '/friend-requests/{requestId}/decline':
    post:
      operationId: declineFriendRequest
      tags:
        - Friends & Social
      summary: Decline a request
      description: Deletes the pending request after returning it with declined status.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /groups:
    get:
      operationId: listGroups
      tags:
        - Groups
      summary: Discover or list groups
      description: Lists all groups available to authenticated users.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroups'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      operationId: createGroup
      tags:
        - Groups
      summary: Create a group
      description: Creates a group, its linked PostgreSQL chat, and an owner membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  '/groups/{groupId}':
    get:
      operationId: getGroup
      tags:
        - Groups
      summary: Get group details
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
          example: grp_123
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateGroup
      tags:
        - Groups
      summary: Update group details
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Group details updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteGroup
      tags:
        - Groups
      summary: Delete a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Group deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  '/groups/{groupId}/members':
    get:
      operationId: listGroupMembers
      tags:
        - Groups
      summary: List group members
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Group members list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupMembers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      operationId: addGroupMember
      tags:
        - Groups
      summary: Join a group or add a member
      description: >-
        With no userId, the authenticated user joins the group. Adding another
        user is restricted to the group owner.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberCreate'
      responses:
        '201':
          description: Group membership created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  '/groups/{groupId}/members/me':
    delete:
      operationId: leaveGroup
      tags:
        - Groups
      summary: Leave a group
      description: Members may leave; the owner must delete the group instead.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Current user left the group
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  '/groups/{groupId}/tags':
    get:
      operationId: listGroupTags
      tags:
        - Groups
      summary: Get group tags
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupTag'
              example:
                - type: artist
                  artistId: artist_1
                  name: Arctic Monkeys
                - type: genre
                  genreId: genre_1
                  name: indie
                - type: genre
                  genreId: genre_2
                  name: alternative
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceGroupTags
      tags:
        - Groups
      summary: Replace group tags
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupTagsReplace'
            example:
              tags:
                - type: artist
                  artistId: artist_1
                - type: genre
                  genreId: genre_1
      responses:
        '200':
          description: Tags updated
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/GroupTag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /artists:
    get:
      operationId: listArtists
      tags:
        - Music Data
      summary: Browse or list artists
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Artist details
          content:
            application/json:
              schema:
                type: object
                required:
                  - artists
                  - pagination
                properties: 
                  artists:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artist'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  '/artists/{artistId}':
    get:
      operationId: getArtist
      tags:
        - Music Data
      summary: Get artist details
      parameters:
        - name: artistId
          in: path
          required: true
          schema:
            type: string
          example: artist_1
      responses:
        '200':
          description: Artist details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /songs:
    get:
      operationId: listSongs
      tags:
        - Music Data
      summary: Browse or list songs
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Song catalog list
          content:
            application/json:
              schema:
                type: object
                required:
                  - songs
                  - pagination
                properties: 
                  songs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Song'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  '/songs/{songId}':
    get:
      operationId: getSong
      tags:
        - Music Data
      summary: Get song details
      parameters:
        - name: songId
          in: path
          required: true
          schema:
            type: string
          example: song_1
      responses:
        '200':
          description: Song details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /genres:
    get:
      operationId: listGenres
      tags:
        - Music Data
      summary: Browse genres
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: object
                required:
                  - genres
                  - pagination
                properties: 
                  genres:
                    type: array
                    items:
                      $ref: '#/components/schemas/Genre'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  '/genres/{genreId}':
    get:
      operationId: getGenre
      tags:
        - Music Data
      summary: Get genre details
      parameters:
        - name: genreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Genre details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /recommendations/friends/by-artists:
    get:
      operationId: recommendFriendsByArtists
      tags:
        - Recommendations
      summary: Recommend users based on artists you listen to
      description: Returns users who have also listened to artists you listened to during the selected time period, grouped by artist. Each artist can have up to 20 recommended users.
      parameters:
        - $ref: '#/components/parameters/Period'
        - name: limit
          in: query
          description: Maximum artists to return
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Recommended users grouped by artist
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    description: Artists and their recommended users
                    items:
                      type: object
                      required:
                        - artist
                        - users
                      properties:
                        artist:
                          $ref: '#/components/schemas/Artist'
                        users:
                          type: array
                          description: Up to 20 users associated with this artist
                          maxItems: 20
                          items:
                            $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /recommendations/friends/by-songs:
    get:
      operationId: recommendFriendsBySongs
      tags:
        - Recommendations
      summary: Recommend users based on songs you listen to
      description: Returns users who listened to the same songs during the selected time period, grouped by song. Each song can have up to 20 recommended users.
      parameters:
        - $ref: '#/components/parameters/Period'
        - name: limit
          in: query
          description: Maximum songs to return
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - $ref: '#/components/parameters/Page'
      responses:
