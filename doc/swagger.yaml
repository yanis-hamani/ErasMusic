  /recommendations/friends/by-friends:
    get:
      operationId: recommendFriendsByFriends
      tags:
        - Recommendations
      summary: Recommend users through your closest friends
      description: >-
        Returns users who are not yet your friends but share at least one mutual
        friend with you. Recommendations are grouped by mutual friend and
        prioritized based on how close you are to each mutual friend. Each mutual
        friend can have up to 20 recommended users.
      parameters:
        - name: limit
          in: query
          description: Maximum number of mutual-friend groups to return per page.
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: >-
            Successfully retrieved recommended users, grouped by mutual friend
            and ordered by the closeness of your relationship with each friend.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    description: >-
                      Groups of recommended users, each associated with a mutual
                      friend.
                    items:
                      type: object
                      required:
                        - friend
                        - users
                      properties:
                        friend:
                          $ref: '#/components/schemas/User'
                        users:
                          type: array
                          description: >-
                            Users who are not yet your friends and who share
                            this mutual friend with you. Each group contains
                            at most 20 recommended users.
                          maxItems: 20
                          items:
                            $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

